name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./my-astro-blog/package-lock.json

      - name: Install dependencies
        working-directory: ./my-astro-blog
        run: npm ci

      - name: Lint
        working-directory: ./my-astro-blog

        run: npm run lint
      - name: Debug Astro installation
        working-directory: ./my-astro-blog
        run: |
          node -p "require('./node_modules/astro/package.json').version"
          ls -la node_modules/astro/tsconfigs
          cat tsconfig.json
          
      - name: Build
        working-directory: ./my-astro-blog
        run: npm run build
